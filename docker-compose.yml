services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soundroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soundroom}
      POSTGRES_DB: ${POSTGRES_DB:-soundroom}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-soundroom} -d ${POSTGRES_DB:-soundroom}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-soundroom}:${POSTGRES_PASSWORD:-soundroom}@db:5432/${POSTGRES_DB:-soundroom}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-me-now}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-Administrator}
      INITIAL_LISTENER_EMAIL: ${INITIAL_LISTENER_EMAIL:-listener@example.com}
      INITIAL_LISTENER_PASSWORD: ${INITIAL_LISTENER_PASSWORD:-listener-password}
      INITIAL_LISTENER_DISPLAY_NAME: ${INITIAL_LISTENER_DISPLAY_NAME:-Listener}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MEDIA_STORAGE_PATH: /data/audio
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"
    volumes:
      - ./backend:/app
      - ./data/audio:/data/audio
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
